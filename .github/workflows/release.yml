name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  tag:
    name: Create release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release tag
        id: release_tag
        uses: yyx990803/release-tag@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          body: |
            [CHANGELOG.md](https://github.com/hujiulong/gcoord/blob/master/CHANGELOG.md)

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: tag
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Validate & build
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Publish with OIDC
        run: npm publish

  publish-gpr:
    name: Publish to GPR
    runs-on: ubuntu-latest
    needs: tag
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@hujiulong'
      - name: Build & publish
        run: |
          npm ci
          npm run build
          npm run gpr-setup
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
